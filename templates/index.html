<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot Arm Vision Dashboard</title>
<style>
  :root {
    --bg: #0f1419; --panel: #1a212b; --border: #2a3441;
    --text: #e6edf3; --muted: #8b98a8; --accent: #3fb6ff;
    --ok: #3fdc8a; --bad: #ff5c6c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  h1 { font-size: 1.25rem; margin: 0; font-weight: 600; }
  .status { font-size: .85rem; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--bad); }
  .dot.on { background: var(--ok); }

  .layout { display: grid; grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr); gap: 16px; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
  .panel h2 { margin: 0 0 10px; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .video img { width: 100%; border-radius: 8px; display: block; background: #000; min-height: 240px; }

  .side { display: flex; flex-direction: column; gap: 16px; }
  .target-label { font-size: 1.6rem; font-weight: 700; color: var(--accent); margin-bottom: 8px; }
  .row { display: flex; justify-content: space-between; padding: 7px 0; border-top: 1px solid var(--border); font-size: .9rem; }
  .row span:first-child { color: var(--muted); }
  .row span:last-child { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: .75rem; }
  .badge.ok { background: rgba(63,220,138,.15); color: var(--ok); }
  .badge.bad { background: rgba(255,92,108,.15); color: var(--bad); }

  table { width: 100%; border-collapse: collapse; font-size: .8rem; }
  th, td { text-align: left; padding: 6px 4px; border-top: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; border-top: none; }
  td { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .empty { color: var(--muted); font-size: .9rem; padding: 8px 0; }
  .cfg { font-size: .75rem; color: var(--muted); font-family: ui-monospace, Menlo, Consolas, monospace; }
</style>
</head>
<body>
<header>
  <h1>🦾 3-DOF Robot Arm &mdash; Vision Dashboard</h1>
  <div class="status"><span class="dot" id="dot"></span><span id="status">Connecting…</span></div>
</header>

<div class="layout">
  <!-- Live MJPEG stream (served by /video_feed) -->
  <section class="panel video">
    <h2>Live Camera</h2>
    <img src="/video_feed" alt="Live video stream">
  </section>

  <div class="side">
    <!-- Primary target = object nearest to the robot base -->
    <section class="panel">
      <h2>Primary Target</h2>
      <div id="target"><div class="empty">No objects detected</div></div>
    </section>

    <!-- All detected objects -->
    <section class="panel">
      <h2>All Objects</h2>
      <div id="all"><div class="empty">—</div></div>
    </section>

    <section class="panel"><div class="cfg" id="cfg"></div></section>
  </div>
</div>

<script>
  // ---- Server-Sent Events: the backend pushes JSON ~10x/second ----
  const dot = document.getElementById("dot");
  const statusEl = document.getElementById("status");
  const targetEl = document.getElementById("target");
  const allEl = document.getElementById("all");
  const cfgEl = document.getElementById("cfg");

  const f = (v, d = 1) => (v === null || v === undefined) ? "—" : Number(v).toFixed(d);

  function renderTarget(o) {
    const reach = o.reachable
      ? '<span class="badge ok">Reachable</span>'
      : '<span class="badge bad">Out of reach</span>';
    return `
      <div class="target-label">${o.label}</div>
      <div class="row"><span>Status</span><span>${reach}</span></div>
      <div class="row"><span>Confidence</span><span>${o.conf === null ? "n/a (contour mode)" : (o.conf * 100).toFixed(0) + " %"}</span></div>
      <div class="row"><span>Image (x, y)</span><span>${f(o.u, 0)}, ${f(o.v, 0)} px</span></div>
      <div class="row"><span>Robot X</span><span>${f(o.X)} mm</span></div>
      <div class="row"><span>Robot Y</span><span>${f(o.Y)} mm</span></div>
      <div class="row"><span>Robot Z</span><span>${f(o.Z)} mm</span></div>
      <div class="row"><span>θ1 Base pan</span><span>${f(o.theta1)}°</span></div>
      <div class="row"><span>θ2 Shoulder</span><span>${f(o.theta2)}°</span></div>
      <div class="row"><span>θ3 Elbow</span><span>${f(o.theta3)}°</span></div>`;
  }

  function renderTable(objs) {
    if (!objs.length) return '<div class="empty">—</div>';
    const rows = objs.map((o, i) => `
      <tr>
        <td>${i + 1}</td><td>${o.label}</td>
        <td>${f(o.X, 0)}, ${f(o.Y, 0)}</td>
        <td>${o.reachable ? f(o.theta1, 0) + "/" + f(o.theta2, 0) + "/" + f(o.theta3, 0) : "n/a"}</td>
      </tr>`).join("");
    return `<table>
      <tr><th>#</th><th>Type</th><th>X, Y (mm)</th><th>θ1/θ2/θ3</th></tr>${rows}</table>`;
  }

  const es = new EventSource("/events");
  es.onmessage = (e) => {
    const d = JSON.parse(e.data);
    dot.classList.toggle("on", d.connected);
    const mode = d.mode === "yolo" ? "YOLO" : (d.mode === "classic" ? "Contour fallback" : "Loading model…");
    statusEl.textContent = (d.connected ? "Camera connected" : "Waiting for camera…") + " · " + mode;
    targetEl.innerHTML = d.objects.length
      ? renderTarget(d.objects[0])
      : '<div class="empty">No objects detected</div>';
    allEl.innerHTML = renderTable(d.objects);
    const c = d.config;
    cfgEl.textContent = `PIXEL_TO_MM=${c.pixel_to_mm}  L1=${c.L1}  L2=${c.L2}  L3=${c.L3}`;
  };
  es.onerror = () => { dot.classList.remove("on"); statusEl.textContent = "Server disconnected"; };
</script>
</body>
</html>
